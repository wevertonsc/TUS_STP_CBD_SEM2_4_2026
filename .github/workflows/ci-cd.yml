name: Stock Predictor CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Test, and Analyse
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and package artefact
        run: mvn clean package -DskipTests -B

      - name: Run unit tests
        run: mvn test -B

      - name: Run integration tests with coverage
        run: mvn verify -B

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/

      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn sonar:sonar \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.projectKey=stock-predictor \
            -B

      - name: Upload JAR artefact
        uses: actions/upload-artifact@v4
        with:
          name: stock-predictor-jar
          path: target/stock-predictor-*.jar

  docker-deploy:
    name: Build Docker Image and Deploy
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build artefact for Docker
        run: mvn clean package -DskipTests -B

      - name: Build Docker image
        run: |
          docker build -t stock-predictor:${{ github.sha }} .
          docker tag stock-predictor:${{ github.sha }} stock-predictor:latest

      - name: Run container smoke test
        run: |
          docker run -d --name sp-smoke -p 8080:8080 stock-predictor:latest
          sleep 25
          curl --fail http://localhost:8080/actuator/health
          docker stop sp-smoke
          docker rm sp-smoke

      - name: Log in to Docker Hub
        if: success()
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: success()
        run: |
          docker push stock-predictor:${{ github.sha }}
          docker push stock-predictor:latest
