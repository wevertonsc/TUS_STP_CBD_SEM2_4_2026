services:

  # ── Jenkins CI/CD Server ────────────────────────────────────────────────────
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: jenkins
    # Fix Docker socket permissions on every container start.
    # The entrypoint runs as root to chmod the socket, then drops to jenkins.
    # This is needed on Docker Desktop for Windows where the socket GID
    # does not match any group inside the container.
    user: root
    entrypoint: >
      /bin/sh -c "
        chmod 666 /var/run/docker.sock &&
        exec su -s /bin/bash jenkins -c '/usr/bin/tini -- /usr/local/bin/jenkins.sh'
      "
    ports:
      - "8090:8080"
      - "50000:50000"
    environment:
      - CASC_JENKINS_CONFIG=/var/jenkins_home/casc_configs/casc.yaml
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Xmx1g
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./jenkins/casc.yaml:/var/jenkins_home/casc_configs/casc.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - maven_repo:/root/.m2
    depends_on:
      sonarqube:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cicd

  # ── SonarQube Code Quality ──────────────────────────────────────────────────
  sonarqube:
    image: sonarqube:10.4-community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    networks:
      - cicd

  # ── Stock Predictor Application ─────────────────────────────────────────────
  stock-predictor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock-predictor
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - cicd

volumes:
  jenkins_home:
  maven_repo:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:

networks:
  cicd:
    driver: bridge